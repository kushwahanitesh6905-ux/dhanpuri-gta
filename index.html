<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dhanpuri GTA - Real Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      padding: 8px 12px;
      pointer-events: auto;
    }

    #top-left-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
    }
    .game-title {
      font-size: 16px;
      font-weight: bold;
      color: #f59e0b;
    }
    .hud-row {
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }
    .hud-value {
      font-weight: bold;
      color: #fff;
    }

    #top-right-panel {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .coin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 18px;
      font-weight: bold;
      color: #ffd700;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #ffd700;
      padding: 4px 12px;
      border-radius: 20px;
    }

    #mission-box {
      position: absolute;
      top: 60px;
      right: 10px;
      max-width: 240px;
      border-left: 4px solid #10b981;
    }
    .mission-header {
      font-size: 11px;
      color: #10b981;
      font-weight: bold;
    }
    .mission-title {
      font-size: 13px;
      font-weight: bold;
      margin: 2px 0;
    }
    .mission-desc {
      font-size: 11px;
      color: #94a3b8;
    }
    .mission-reward {
      margin-top: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #ffd700;
    }

    #speedo-box {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 14px;
      color: #fff;
      font-weight: bold;
      display: flex;
      gap: 5px;
      align-items: baseline;
    }
    #speed-val {
      font-size: 24px;
      color: #38bdf8;
    }

    #mission-modal {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid #ffd700;
      border-radius: 12px;
      padding: 16px 24px;
      text-align: center;
      color: #fff;
      display: none;
      z-index: 50;
    }
    #mission-modal h2 {
      color: #ffd700;
      font-size: 20px;
      margin-bottom: 5px;
    }

    /* MOBILE CONTROLS */
    #mobile-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }
    .btn-touch {
      pointer-events: auto;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn-touch:active {
      background: rgba(59, 130, 246, 0.9);
      transform: scale(0.95);
    }

    #dpad-cluster {
      position: absolute;
      bottom: 25px;
      left: 15px;
      width: 140px;
      height: 140px;
    }
    #btn-up { position: absolute; top: 0; left: 45px; width: 50px; height: 50px; }
    #btn-left { position: absolute; top: 45px; left: 0; width: 50px; height: 50px; }
    #btn-down { position: absolute; bottom: 0; left: 45px; width: 50px; height: 50px; }
    #btn-right { position: absolute; top: 45px; right: 0; width: 50px; height: 50px; }

    #action-cluster {
      position: absolute;
      bottom: 25px;
      right: 15px;
      width: 150px;
      height: 150px;
    }
    #btn-gas { position: absolute; top: 0; right: 10px; width: 58px; height: 58px; background: rgba(34, 197, 94, 0.8); }
    #btn-brake { position: absolute; bottom: 10px; right: 0; width: 52px; height: 52px; background: rgba(239, 68, 68, 0.8); }
    #btn-car { position: absolute; top: 10px; left: 0; width: 52px; height: 52px; background: rgba(245, 158, 11, 0.8); font-size: 11px; text-align: center; }
    #btn-fly { position: absolute; bottom: 15px; left: 15px; width: 48px; height: 48px; background: rgba(14, 165, 233, 0.8); font-size: 11px; text-align: center; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div id="top-left-panel" class="hud-card">
      <div class="game-title">DHANPURI GTA</div>
      <div class="hud-row"><span>Status:</span> <span id="hud-status" class="hud-value">Paidal (Foot)</span></div>
      <div class="hud-row"><span>Gadi:</span> <span id="hud-car" class="hud-value">Koi Nahi</span></div>
      <div class="hud-row"><span>Jagah:</span> <span id="hud-location" class="hud-value">Dhanpuri Chowk</span></div>
    </div>

    <div id="top-right-panel">
      <div class="coin-badge">
        <span>🪙</span>
        <span id="hud-coins">0</span>
      </div>
    </div>

    <div id="mission-box" class="hud-card">
      <div class="mission-header">★ Active Mission</div>
      <div class="mission-title" id="m-title">Loading...</div>
      <div class="mission-desc" id="m-desc">...</div>
      <div class="mission-reward" id="m-reward">+500 Coins</div>
    </div>

    <div id="speedo-box">
      <span id="speed-val">0</span> <span>KM/H</span>
    </div>
  </div>

  <div id="mission-modal">
    <h2>🎉 MISSION PASSED!</h2>
    <p id="modal-mission-name">Mission Name</p>
    <div style="color: #4ade80; font-weight: bold; margin-top: 6px;" id="modal-reward">+500 Coins</div>
  </div>

  <div id="mobile-controls">
    <div id="dpad-cluster">
      <div class="btn-touch" id="btn-up">▲</div>
      <div class="btn-touch" id="btn-left">◀</div>
      <div class="btn-touch" id="btn-down">▼</div>
      <div class="btn-touch" id="btn-right">▶</div>
    </div>
    <div id="action-cluster">
      <div class="btn-touch" id="btn-gas">GAS</div>
      <div class="btn-touch" id="btn-brake">STOP</div>
      <div class="btn-touch" id="btn-car">GADI<br>[F]</div>
      <div class="btn-touch" id="btn-fly">UDAAN<br>[G]</div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('game-canvas');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.FogExp2(0x87ceeb, 0.0035);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // LIGHTS
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
      dirLight.position.set(100, 150, 50);
      scene.add(dirLight);

      // GROUND
      const groundGeo = new THREE.PlaneGeometry(1200, 1200);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x2e4823 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // ROAD GENERATOR
      function createRoad(w, l, x, z, rot = 0) {
        const geo = new THREE.PlaneGeometry(w, l);
        const mat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.rotation.z = rot;
        mesh.position.set(x, 0.05, z);
        scene.add(mesh);

        // Center line
        const lineGeo = new THREE.PlaneGeometry(0.8, l);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xeab308 });
        const lineMesh = new THREE.Mesh(lineGeo, lineMat);
        lineMesh.rotation.x = -Math.PI / 2;
        lineMesh.rotation.z = rot;
        lineMesh.position.set(x, 0.06, z);
        scene.add(lineMesh);
      }

      createRoad(16, 600, 0, 0, 0);
      createRoad(16, 600, 0, 0, Math.PI / 2);
      createRoad(20, 500, 0, -220, Math.PI / 2);

      // BILLBOARD GENERATOR
      function createBillboard(title, sub) {
        const cv = document.createElement('canvas');
        cv.width = 512; cv.height = 160;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, 512, 160);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, 504, 152);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(title, 256, 65);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(sub, 256, 120);

        const tex = new THREE.CanvasTexture(cv);
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(16, 5),
          new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
        );

        const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 8);
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x64748b });
        const p1 = new THREE.Mesh(poleGeo, poleMat);
        p1.position.set(-6, -4, 0);
        const p2 = new THREE.Mesh(poleGeo, poleMat);
        p2.position.set(6, -4, 0);
        mesh.add(p1); mesh.add(p2);
        return mesh;
      }

      // LANDMARKS
      const landmarks = [
        { name: "Dhanpuri Chowk", x: 0, z: 0, r: 40 },
        { name: "SECL Main Gate", x: -160, z: -120, r: 45 },
        { name: "Dhanpuri Railway Stn", x: 170, z: 130, r: 50 },
        { name: "Maa Jwalamukhi Mandir", x: 150, z: -150, r: 45 },
        { name: "Burhar Highway SH-9", x: 0, z: -220, r: 50 }
      ];

      // SECL Gate
      const secl = new THREE.Group();
      secl.position.set(-160, 0, -120);
      const seclMat = new THREE.MeshLambertMaterial({ color: 0x1e3a8a });
      const pA = new THREE.Mesh(new THREE.BoxGeometry(4, 12, 4), seclMat); pA.position.set(-8, 6, 0);
      const pB = new THREE.Mesh(new THREE.BoxGeometry(4, 12, 4), seclMat); pB.position.set(8, 6, 0);
      const topB = new THREE.Mesh(new THREE.BoxGeometry(20, 2.5, 4), seclMat); topB.position.set(0, 11, 0);
      secl.add(pA, pB, topB);
      const seclSign = createBillboard("SECL MAIN GATE", "DHANPURI COLLIERY");
      seclSign.position.set(0, 16, 0);
      secl.add(seclSign);
      scene.add(secl);

      // Station
      const stn = new THREE.Group();
      stn.position.set(170, 0, 130);
      const stnBld = new THREE.Mesh(new THREE.BoxGeometry(32, 10, 14), new THREE.MeshLambertMaterial({ color: 0x991b1b }));
      stnBld.position.set(0, 5, 0);
      stn.add(stnBld);
      const stnSign = createBillboard("DHANPURI STATION", "SECR RAILWAY");
      stnSign.position.set(0, 14, 8);
      stn.add(stnSign);
      scene.add(stn);

      // Mandir
      const mandir = new THREE.Group();
      mandir.position.set(150, 0, -150);
      const baseM = new THREE.Mesh(new THREE.BoxGeometry(20, 8, 20), new THREE.MeshLambertMaterial({ color: 0xfef08a }));
      baseM.position.set(0, 4, 0);
      const topM = new THREE.Mesh(new THREE.ConeGeometry(8, 12, 4), new THREE.MeshLambertMaterial({ color: 0xea580c }));
      topM.position.set(0, 14, 0);
      mandir.add(baseM, topM);
      const mSign = createBillboard("JWALAMUKHI MANDIR", "DHANPURI SHAKTIPITH");
      mSign.position.set(0, 17, 11);
      mandir.add(mSign);
      scene.add(mandir);

      // Buildings
      const bMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
      for (let i = 0; i < 40; i++) {
        const bx = (Math.random() - 0.5) * 450;
        const bz = (Math.random() - 0.5) * 450;
        if (Math.abs(bx) > 25 && Math.abs(bz) > 25) {
          const h = 10 + Math.random() * 20;
          const bm = new THREE.Mesh(new THREE.BoxGeometry(14, h, 14), bMat);
          bm.position.set(bx, h / 2, bz);
          scene.add(bm);
        }
      }

      // CAR SPRITE NAME
      function createCarLabel(name, hexColor) {
        const cv = document.createElement('canvas');
        cv.width = 256; cv.height = 80;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(10, 10, 236, 60);
        ctx.strokeStyle = hexColor;
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, 236, 60);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, 128, 40);

        const tex = new THREE.CanvasTexture(cv);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
        sprite.scale.set(6, 2, 1);
        return sprite;
      }

      // CARS
      const cars = [];
      const carData = [
        { name: "Hasan", color: 0xdc2626, hex: "#dc2626", x: 10, z: -10 },
        { name: "Nitesh", color: 0x2563eb, hex: "#2563eb", x: -15, z: 15 },
        { name: "Kartik", color: 0x16a34a, hex: "#16a34a", x: 20, z: 25 },
        { name: "Yaseen", color: 0x9333ea, hex: "#9333ea", x: -25, z: -20 },
        { name: "Sheru", color: 0xf59e0b, hex: "#f59e0b", x: 0, z: 35 }
      ];

      carData.forEach(d => {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 5.0), new THREE.MeshLambertMaterial({ color: d.color }));
        body.position.y = 0.6;
        const roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.7, 2.5), new THREE.MeshLambertMaterial({ color: 0x111827 }));
        roof.position.set(0, 1.3, -0.2);
        group.add(body, roof);

        // Wheels
        const wGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 12);
        wGeo.rotateZ(Math.PI / 2);
        const wMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        [[-1.1, 0.45, 1.4], [1.1, 0.45, 1.4], [-1.1, 0.45, -1.4], [1.1, 0.45, -1.4]].forEach(p => {
          const wm = new THREE.Mesh(wGeo, wMat);
          wm.position.set(...p);
          group.add(wm);
        });

        // Label
        const label = createCarLabel(d.name, d.hex);
        label.position.set(0, 3.2, 0);
        group.add(label);

        group.position.set(d.x, 0, d.z);
        scene.add(group);

        cars.push({
          mesh: group,
          label: label,
          name: d.name,
          speed: 0,
          isFlying: false,
          flightAlt: 0
        });
      });

      // PLAYER
      const playerGroup = new THREE.Group();
      const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5), new THREE.MeshLambertMaterial({ color: 0x3b82f6 }));
      pBody.position.y = 0.85;
      const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshLambertMaterial({ color: 0xfde047 }));
      pHead.position.y = 1.8;
      playerGroup.add(pBody, pHead);
      playerGroup.position.set(0, 0, 5);
      scene.add(playerGroup);

      let activeCar = null;

      // MISSIONS
      let coins = 0;
      let missionIdx = 0;
      const missions = [
        { title: "SECL Inspection", desc: "SECL Main Gate par jao.", target: { x: -160, z: -120 }, reward: 500 },
        { title: "Railway Express", desc: "Dhanpuri Railway Station pahuncho.", target: { x: 170, z: 130 }, reward: 750 },
        { title: "Mandir Darshan", desc: "Maa Jwalamukhi Mandir jao.", target: { x: 150, z: -150 }, reward: 600 },
        { title: "Highway Sprint", desc: "Burhar Highway SH-9 par test run karo.", target: { x: 0, z: -220 }, reward: 1000 }
      ];

      // Checkpoint Ring
      const checkGroup = new THREE.Group();
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 70, 16), new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.4 }));
      beam.position.y = 35;
      const ring = new THREE.Mesh(new THREE.RingGeometry(2, 5, 16), new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.2;
      checkGroup.add(beam, ring);
      scene.add(checkGroup);

      function updateMissionUI() {
        if (missionIdx >= missions.length) {
          document.getElementById('m-title').textContent = "Sabhi Mission Poore Hue!";
          document.getElementById('m-desc').textContent = "Shaabash! Aapne Dhanpuri jeet liya.";
          document.getElementById('m-reward').textContent = "";
          checkGroup.visible = false;
          return;
        }
        const m = missions[missionIdx];
        document.getElementById('m-title').textContent = m.title;
        document.getElementById('m-desc').textContent = m.desc;
        document.getElementById('m-reward').textContent = `+
